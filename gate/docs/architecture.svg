<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 750" width="1160" height="750"><rect width="1160" height="750" fill="#ffffff"/><style>text{font-family:Arial,sans-serif;fill:#374151}.heading{font-size:29px;font-weight:bold;fill:#1e40af}.sub{font-size:16px;fill:#64748b}.label{font-size:20px;font-weight:bold}.small{font-size:15px}.code{fill:#22c55e}.light{fill:#fff}</style><text class="heading" x="35" y="52">AgentQuant | Search-aware evaluation</text><text class="sub" x="35" y="91">Issue #45 - architecture and current implementation boundary</text><rect x="45" y="150" width="230" height="98" rx="12" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text class="label" x="63" y="188">Agent search loop</text><text class="small" x="63" y="222">candidate config / seed</text><path d="M279 200 H361" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="364" y="135" width="260" height="126" rx="12" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text class="label" x="384" y="177">Ledger.trial(...)</text><text class="small" x="384" y="210">trial | error | decision</text><text class="small" x="374" y="239">holdout_read | commit | reveal</text><path d="M628 197 H688" stroke="#1e3a5f" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="690" y="150" width="245" height="98" rx="12" fill="#1e293b"/><text class="label code" x="709" y="187">SHA-256 hash chain</text><text class="small light" x="707" y="220">prev_hash → entry_hash</text><rect x="55" y="365" width="265" height="110" rx="12" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text class="label" x="70" y="397">Per-seed observations</text><text class="small" x="68" y="440">scores: [0.71, 0.74, 0.69]</text><path d="M323 421 H388" stroke="#1e3a5f" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="391" y="352" width="230" height="130" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text class="label" x="407" y="388">Gate.evaluate(...)</text><text class="small" x="402" y="426">paired max-T: non-Sharpe</text><text class="small" x="402" y="455">Sharpe: fail closed</text><path d="M625 418 H693" stroke="#1e3a5f" stroke-width="3" fill="none" marker-end="url(#arr)"/><polygon points="773,358 848,420 773,483 698,420" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="735" y="425" font-size="17">Evidence?</text><path d="M851 419 H898" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="902" y="362" width="205" height="104" rx="12" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text class="label" x="922" y="395">GateDecision</text><text class="small" x="911" y="428">promote / reject /</text><text x="912" y="452" font-size="13">insufficient_evidence</text><path d="M493 487 V557 H193 V481" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="6 5"/><text class="sub" x="231" y="590">Every decision is appended to the same ledger</text><rect x="45" y="632" width="1040" height="89" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="70" y="673" font-weight="bold" font-size="21" fill="#dc2626">NOT INTEGRATED INTO AGENTQUANT YET</text><text x="70" y="702" font-size="15">policy_mutation still uses PROMOTION_EPSILON; DSR, audits, and prospective grading are pending.</text><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3 Z" fill="#1e3a5f"/></marker></defs></svg>