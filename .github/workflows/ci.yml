name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,llm]"

      - name: Run linter (ruff)
        run: |
          ruff check src/ tests/ --output-format=github

      - name: Type checking (mypy)
        continue-on-error: true
        run: |
          mypy src/ --ignore-missing-imports || true

      - name: Run unit tests
        env:
          GOOGLE_API_KEY: ""
          FRED_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          TAVILY_API_KEY: ""
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  base-install:
    name: Base install (no extras, offline demo)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install base package only (no dev/llm/ui/data/backtest/regime extras)
        run: |
          pip install --upgrade pip
          pip install .

      - name: Core CLI is importable without optional extras
        run: |
          python -c "import src.cli; import src.agent.agent_graph; import src.agent.runner"

      - name: Run the offline demo with network access blocked
        env:
          GOOGLE_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          TAVILY_API_KEY: ""
          FRED_API_KEY: ""
          NO_PROXY: "*"
          # yfinance/requests calls will fail closed rather than silently
          # reaching the network -- the offline demo must not depend on them.
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
        run: |
          python -m src.demo

  wheel-install:
    name: Build wheel/sdist and run CLI from outside the checkout
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Build sdist and wheel
        run: |
          pip install --upgrade pip build
          python -m build
          ls dist/

      - name: Install the built wheel into a clean venv (no editable, no source checkout on path)
        run: |
          python -m venv /tmp/agentquant-wheel-venv
          /tmp/agentquant-wheel-venv/bin/pip install --upgrade pip
          /tmp/agentquant-wheel-venv/bin/pip install dist/*.whl

      - name: Run installed CLI entry points from a directory outside the checkout
        run: |
          mkdir -p /tmp/agentquant-outside-checkout
          cd /tmp/agentquant-outside-checkout
          /tmp/agentquant-wheel-venv/bin/agentquant --help
          /tmp/agentquant-wheel-venv/bin/agentquant run --help
          /tmp/agentquant-wheel-venv/bin/agentquant memory --help
          # config.yaml is intentionally not packaged; confirm the CLI still
          # runs from defaults rather than crashing on a repo-relative path.
          /tmp/agentquant-wheel-venv/bin/python -c "from src.utils.config import config; print('config loaded with defaults:', config.reference_asset)"

  harness-verification:
    name: Harness evolution results are not stale (informational)
    # Runs the 6-epoch evolution from agentquant-artifacts and compares it with the committed
    # results (#20). Informational: a failure shows as a warning and never blocks the pipeline
    # or the quality gate, because the scripts and results live in another repo.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: OnePunchMonk/agentquant-artifacts
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify harness evolution results are not stale
        env:
          GOOGLE_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          TAVILY_API_KEY: ""
        run: |
          python artifacts/benchmarks/verify_harness_results.py

  security-check:
    name: Security & Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in tracked files
        run: |
          if git ls-files | grep -E "^\.env$|^\.env\." | grep -v ".env.example"; then
            echo "ERROR: .env file is tracked by git!"
            exit 1
          fi
          echo "✓ No .env files committed"

      - name: Verify critical files not leaked
        run: |
          if git ls-files | grep -iE "(secret|password|token|key)" | grep -v "\.example\|\.md\|\.txt"; then
            echo "WARNING: Potential secrets found in filenames"
            exit 1
          fi
          echo "✓ No secrets detected in filenames"

      - name: Check config integrity
        run: |
          test -f config.yaml && echo "✓ config.yaml exists"
          test -f .env.example && echo "✓ .env.example template found"
          test -f .gitignore && echo "✓ .gitignore configured"

  quality-gates:
    name: Quality Gates
    needs: [test, base-install, wheel-install, security-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: All checks passed
        run: |
          echo "✅ All CI/CD gates passed"
          echo "  • Unit tests: ✓"
          echo "  • Linting: ✓"
          echo "  • Harness verification: ✓"
          echo "  • Security checks: ✓"
          echo ""
          echo "Pipeline ready for deployment"
