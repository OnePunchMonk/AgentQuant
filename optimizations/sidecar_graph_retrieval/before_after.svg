<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1270" viewBox="0 0 1400 1270"><rect width="1400" height="1270" fill="#ffffff"/>
<text x="60" y="72" fill="#1e40af" font-family="DejaVu Sans Mono,monospace" font-size="32">
<tspan x="60" dy="0">Resolve contradictions only for the hits you return</tspan>
</text>
<text x="60" y="121" fill="#64748b" font-family="DejaVu Sans Mono,monospace" font-size="19">
<tspan x="60" dy="0">AgentQuant / EvidenceGraph.retrieve / same ranking, citations and temporal visibility</tspan>
</text>
<text x="60" y="200" fill="#b91c1c" font-family="DejaVu Sans Mono,monospace" font-size="25">
<tspan x="60" dy="0">BEFORE  /  enrich, then discard</tspan>
</text>
<text x="100" y="260" fill="#374151" font-family="DejaVu Sans Mono,monospace" font-size="20">
<tspan x="100" dy="0">Filter visible evidence</tspan>
<tspan x="100" dy="25.0">Group edges by candidate node</tspan>
</text>
<polyline points="305,310 305,355" fill="none" stroke="#1e3a5f" stroke-width="2" />
<polygon points="305,355 300.20574461395796,346.22417438109625 309.79425538604204,346.22417438109625" fill="#1e3a5f"/>
<rect x="60" y="365" width="550" height="220" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="85" y="407" fill="#b91c1c" font-family="DejaVu Sans Mono,monospace" font-size="22">
<tspan x="85" dy="0">For EVERY matching candidate</tspan>
</text>
<text x="85" y="459" fill="#374151" font-family="DejaVu Sans Mono,monospace" font-size="19">
<tspan x="85" dy="0">Scan ALL graph edges</tspan>
<tspan x="85" dy="23.75">Check visibility + contradiction</tspan>
<tspan x="85" dy="23.75">Sort evidence and contradictions</tspan>
</text>
<polyline points="610,535 645,535 645,420 610,420" fill="none" stroke="#dc2626" stroke-width="2" />
<polygon points="610,420 618.7758256189037,415.20574461395796 618.7758256189037,424.79425538604204" fill="#dc2626"/>
<text x="85" y="567" fill="#b91c1c" font-family="DejaVu Sans Mono,monospace" font-size="17">
<tspan x="85" dy="0">Repeated work grows with matches × edges</tspan>
</text>
<polyline points="305,595 305,640" fill="none" stroke="#dc2626" stroke-width="2" />
<polygon points="305,640 300.20574461395796,631.2241743810963 309.79425538604204,631.2241743810963" fill="#dc2626"/>
<text x="100" y="675" fill="#374151" font-family="DejaVu Sans Mono,monospace" font-size="20">
<tspan x="100" dy="0">Sort all enriched hits</tspan>
<tspan x="100" dy="25.0">Keep only the top k (k = 4 here)</tspan>
</text>
<rect x="60" y="750" width="550" height="130" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="80" y="790" fill="#22c55e" font-family="DejaVu Sans Mono,monospace" font-size="18">
<tspan x="80" dy="0">for node in candidates:</tspan>
<tspan x="80" dy="22.5">    scan(self.edges)  # contradictions</tspan>
<tspan x="80" dy="22.5">return sorted(hits)[:limit]</tspan>
</text>
<polyline points="690,175 690,880" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
<text x="750" y="200" fill="#047857" font-family="DejaVu Sans Mono,monospace" font-size="25">
<tspan x="750" dy="0">AFTER  /  select, then enrich</tspan>
</text>
<text x="790" y="260" fill="#374151" font-family="DejaVu Sans Mono,monospace" font-size="20">
<tspan x="790" dy="0">Filter visible evidence</tspan>
<tspan x="790" dy="25.0">Score candidate nodes as before</tspan>
</text>
<polyline points="770,320 880,385" fill="none" stroke="#047857" stroke-width="3" />
<polyline points="1300,320 1190,385" fill="none" stroke="#047857" stroke-width="3" />
<text x="870" y="345" fill="#047857" font-family="DejaVu Sans Mono,monospace" font-size="20">
<tspan x="870" dy="0">heapq.nsmallest(k, hits)</tspan>
</text>
<polyline points="1035,390 1035,430" fill="none" stroke="#047857" stroke-width="2" />
<polygon points="1035,430 1030.205744613958,421.22417438109625 1039.794255386042,421.22417438109625" fill="#047857"/>
<text x="790" y="464" fill="#374151" font-family="DejaVu Sans Mono,monospace" font-size="19">
<tspan x="790" dy="0">Index visible assertions ONCE</tspan>
<tspan x="790" dy="23.75">Key: (subject, predicate)</tspan>
<tspan x="790" dy="23.75">Retain assertions outside query/regime</tspan>
</text>
<polyline points="1035,540 1035,585" fill="none" stroke="#047857" stroke-width="2" />
<polygon points="1035,585 1030.205744613958,576.2241743810963 1039.794255386042,576.2241743810963" fill="#047857"/>
<text x="790" y="624" fill="#374151" font-family="DejaVu Sans Mono,monospace" font-size="19">
<tspan x="790" dy="0">For ONLY the top k hits:</tspan>
<tspan x="790" dy="23.75">resolve matching contradictions</tspan>
<tspan x="790" dy="23.75">sort evidence; return identical hits</tspan>
</text>
<rect x="750" y="750" width="590" height="130" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="770" y="789" fill="#22c55e" font-family="DejaVu Sans Mono,monospace" font-size="17">
<tspan x="770" dy="0">selected = heapq.nsmallest(limit, hits, key=rank)</tspan>
<tspan x="770" dy="21.25">assertions[(subject, predicate)] = visible_edges</tspan>
<tspan x="770" dy="21.25">for hit in selected: resolve_contradictions(hit)</tspan>
</text>
<polyline points="60,925 1340,925" fill="none" stroke="#64748b" stroke-width="2" />
<text x="60" y="978" fill="#1e40af" font-family="DejaVu Sans Mono,monospace" font-size="23">
<tspan x="60" dy="0">Measured local CPU latency  /  400 synthetic trials, median of 7 runs</tspan>
</text>
<text x="60" y="1036" fill="#047857" font-family="DejaVu Sans Mono,monospace" font-size="26">
<tspan x="60" dy="0">Retrieval                   206.39 ms → 2.53 ms       81.4× faster</tspan>
</text>
<text x="60" y="1091" fill="#047857" font-family="DejaVu Sans Mono,monospace" font-size="26">
<tspan x="60" dy="0">Graph rebuild + retrieval   223.41 ms → 22.46 ms       9.95× faster</tspan>
</text>
<text x="60" y="1155" fill="#1e40af" font-family="DejaVu Sans Mono,monospace" font-size="20">
<tspan x="60" dy="0">180 exact-output parity cases matched / cutoffs, queries, regimes and result limits</tspan>
</text>
<text x="60" y="1197" fill="#64748b" font-family="DejaVu Sans Mono,monospace" font-size="17">
<tspan x="60" dy="0">Scope: graph CPU work only. Excludes SQLite, provider calls and full agent execution.</tspan>
<tspan x="60" dy="21.25">Evidence: results/sidecar_latency.json  |  Reproduce: scripts/benchmark_sidecar_latency.py</tspan>
</text>
</svg>